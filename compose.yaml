services:
  api:
    build:
      context: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      API_KEYS: "${API_KEYS:-}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-60}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      INSTAGRAM_PROXY: "${INSTAGRAM_PROXY:-}"
      INSTAGRAM_PROXIES: "${INSTAGRAM_PROXIES:-}"
      INSTAGRAM_HTTP_PROXY: "${INSTAGRAM_HTTP_PROXY:-}"
      INSTAGRAM_HTTPS_PROXY: "${INSTAGRAM_HTTPS_PROXY:-}"
      INSTAGRAM_REQUEST_TIMEOUT: "${INSTAGRAM_REQUEST_TIMEOUT:-30}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-*}"
    restart: unless-stopped
